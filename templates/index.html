<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Fake News Detection</h2>
        <form method="post">
            <textarea name="text" rows="10" placeholder="Enter news article content..."></textarea><br>
            <button type="submit">Check</button>
        </form>

        {% if prediction %}
        <div class="result">
            <strong>Result:</strong> {{ prediction }} <br>
            <strong>Confidence:</strong> {{ confidence }}
        </div>
        {% endif %}
    </div>
</body>
</html>
